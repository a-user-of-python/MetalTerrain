name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  ios-build:
    name: Build demo app (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project Demo/TerrainDemo/TerrainDemo.xcodeproj \
            -scheme TerrainDemo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name "TerrainDemo.app" -maxdepth 1 | head -1)
          test -d "$APP" || { echo "missing app"; find build/Build/Products -name "*.app" | head -5; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y TerrainDemo-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TerrainDemo-unsigned
          path: TerrainDemo-unsigned.ipa
