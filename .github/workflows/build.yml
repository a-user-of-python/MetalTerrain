name: Build Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift-build:
    name: Swift package build check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Build Swift package
        run: swift build -v
